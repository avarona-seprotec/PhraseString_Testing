phrase:
  project_id: "c82889bdf73013f4d77c664e5abdb1ec"
  file_format: "html"

  push:                                                     # Import (repo → Phrase)
    sources:
      - file: "./es/*.html"
        params:
          locale_id: "es"                                   # source/default
          update_translations: false

  pull:                                                     # Export (Phrase → repo)
    targets:
      - file: "./en/*.html"
        params:
          locale_id: "en"                                   # SOLO en; es no se exporta nunca
          # format_options:
          #   document_id: "..."                            # ver nota